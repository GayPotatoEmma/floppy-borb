<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>⚠️ Access Notice ⚠️</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"> 
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin> 
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Page overrides */
    body { background-color: #f2f2f2; height: 100vh; display:flex; align-items:center; justify-content:center; margin:0; }
    .notice-card {
      width: 90%;
      max-width: 700px;
      border: 2px solid black;
      border-radius: 12px;
      padding: 32px;
      background: rgba(255,255,255,0.9);
      text-align: center;
      box-shadow: 3px 4px 6px rgba(0,0,0,0.2);
      font-family: 'Press Start 2P', cursive;
    }
    .notice-title { font-size: 20px; margin-bottom: 18px; }
    .notice-body { font-size: 12px; margin-bottom: 10px; line-height:1.4; }
    .notice-actions a {
      display:inline-block;
      text-decoration:none;
      padding: 10px 18px;
      border-radius:8px;
      border:3px solid black;
      font-family: 'Press Start 2P', cursive;
      margin: 6px;
    }
  </style>
</head>
<body>
  <div class="notice-card" role="main">
    <div class="notice-title">⚠️ Access Notice ⚠️</div>
    <div class="notice-body">
      Access from your region has been disabled. This is a personal decision, based on my disagreement with the path your fascist government is currently taking.
    </div>
  </div>
</body>
</html>
